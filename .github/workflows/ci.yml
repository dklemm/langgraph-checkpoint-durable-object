name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Run the tests against the oldest versions the peer ranges in package.json
  # allow, so a lower bound we can't actually support fails here. Keep these in
  # step with peerDependencies. @langchain/langgraph is only used by the tests;
  # 1.5.1 is the newest release that accepts langgraph-checkpoint 1.2.0.
  oldest-supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm install --no-save @langchain/core@1.1.48 @langchain/langgraph-checkpoint@1.2.0 @langchain/langgraph@1.5.1
      - run: npm run typecheck
      - run: npm test
